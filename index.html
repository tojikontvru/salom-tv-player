<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover,user-scalable=no">
<title>Sarkor TV — Онлайн телевидение</title>
<meta name="theme-color" content="#0d0d0d">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html{font-size:16px}
body{font-family:Inter,sans-serif;color:#fff;background:#0d0d0d;min-height:100dvh;-webkit-font-smoothing:antialiased;overflow-x:hidden}
::-webkit-scrollbar{width:4px;height:4px}::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:99px}
*{scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.1) transparent}

/* ===== HEADER ===== */
.hdr{display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:12px 20px;background:#121212;border-bottom:1px solid rgba(255,255,255,.06);position:sticky;top:0;z-index:100}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;flex-shrink:0;cursor:pointer}
.logo .lg{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#26a0b0,#1f6f8b);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.95rem;color:#fff}
.logo .tx{font-size:1.15rem;font-weight:800;color:#fff;letter-spacing:-.02em}
.logo .tx em{font-style:normal;color:#26a0b0}
.tabs{display:flex;flex-wrap:wrap;gap:4px;flex:1;min-width:140px;justify-content:center}
.tab{padding:6px 13px;border:none;border-radius:7px;background:transparent;color:#999;font:500 clamp(.66rem,.8vw,.78rem)/1.3 Inter,sans-serif;cursor:pointer;white-space:nowrap;transition:.15s;-webkit-tap-highlight-color:transparent;user-select:none}
.tab:hover{color:#fff;background:rgba(255,255,255,.07)}
.tab:active{transform:scale(.95)}
.tab.on{background:#26a0b0;color:#fff;font-weight:600}
.srch{position:relative;flex:1;min-width:120px;max-width:260px}
.srch svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;opacity:.4;pointer-events:none}
.srch input{width:100%;padding:9px 10px 9px 34px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.09);border-radius:8px;color:#fff;font-size:.82rem;outline:none;transition:.15s;-webkit-appearance:none}
.srch input::placeholder{color:#666}
.srch input:focus{border-color:#26a0b0;background:rgba(255,255,255,.09)}

.wrap{max-width:1600px;margin:0 auto;padding:clamp(10px,1.5vw,24px)}
.gh{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.gh h2{font-size:clamp(.9rem,1.2vw,1.1rem);font-weight:700;color:#fff;letter-spacing:-.02em}
.gh span{font-size:clamp(.65rem,.8vw,.72rem);color:rgba(255,255,255,.3)}
.grid{display:grid;grid-template-columns:repeat(var(--c,6),1fr);gap:clamp(8px,1vw,14px)}

/* ===== CARD ===== */
.card{display:flex;flex-direction:column;border-radius:10px;overflow:hidden;cursor:pointer;background:#161616;border:1px solid rgba(255,255,255,.05);transition:transform .2s,border-color .2s,background .2s;-webkit-tap-highlight-color:transparent;position:relative}
@media(hover:hover){.card:hover{transform:translateY(-3px);border-color:#26a0b0;background:#1a1a1a}}
.card:active{transform:scale(.97)}
.card .logobox{width:100%;aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;background:#1f1f1f;padding:12px;position:relative;transition:background .2s}
.card .logobox img{max-width:85%;max-height:70%;object-fit:contain;filter:drop-shadow(0 2px 6px rgba(0,0,0,.5));transition:transform .3s}
@media(hover:hover){.card:hover .logobox{background:#222}.card:hover .logobox img{transform:scale(1.05)}}
.card .live{position:absolute;top:8px;left:8px;padding:2px 7px;border-radius:4px;background:rgba(224,30,60,.92);color:#fff;font-size:.55rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;pointer-events:none;z-index:2;display:none}
.card.avail .live{display:block}
.card .info{padding:9px 11px 11px;display:flex;flex-direction:column;gap:2px}
.card .info h3{font-size:clamp(.68rem,.8vw,.76rem);font-weight:600;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#e8e8e8}
.card .info .sub{font-size:clamp(.58rem,.65vw,.62rem);color:#666;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .lock{position:absolute;top:8px;right:8px;width:22px;height:22px;border-radius:6px;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;font-size:.6rem;color:#999;z-index:2;pointer-events:none}
.card.avail .lock{display:none}

/* ===== LOADING ===== */
.ld{display:flex;flex-direction:column;align-items:center;gap:14px;justify-content:center;min-height:240px}
.ld .sp{width:34px;height:34px;border:3px solid rgba(255,255,255,.06);border-top-color:#26a0b0;border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.ld p{font-size:.82rem;color:#888;font-weight:500}
.st{text-align:center;padding:40px 20px;border-radius:12px;background:#161616}
.st p{color:#888;font-size:.86rem;margin:8px 0 14px;max-width:400px;margin-left:auto;margin-right:auto}
.st button{padding:8px 22px;border:none;border-radius:7px;background:#26a0b0;color:#fff;font:600 .8rem Inter,sans-serif;cursor:pointer;transition:.15s}
.st button:hover{background:#1f8a98}
.st-er{border:1px solid rgba(255,90,110,.2)}
.hid{display:none!important}

/* ===== PLAYER ===== */
#player{display:none;position:fixed;inset:0;z-index:1000;background:#000;-webkit-user-select:none;user-select:none}
#player.on{display:flex}
#player video{width:100%;height:100%;object-fit:contain;display:block;background:#000}
.buf{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:40px;height:40px;border:3px solid rgba(255,255,255,.1);border-top-color:#26a0b0;border-radius:50%;animation:sp .7s linear infinite;z-index:1;pointer-events:none}
.buf.off{display:none}
.ctrl{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;justify-content:flex-end;opacity:0;transition:opacity .35s;pointer-events:none}
.ctrl.on{opacity:1;pointer-events:auto}
.ctrl .overlay{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.85) 0%,rgba(0,0,0,.15) 50%,transparent 100%);pointer-events:none;z-index:-1}
.ctrl .top{display:flex;align-items:center;gap:12px;padding:16px 20px;position:absolute;top:0;left:0;right:0}
.ctrl .top span{flex:1;font-weight:700;font-size:clamp(.9rem,2vw,1.3rem);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 4px rgba(0,0,0,.5)}
.ctrl .top button{width:36px;height:36px;border:none;border-radius:50%;background:rgba(0,0,0,.5);color:#fff;font-size:1.1rem;cursor:pointer;transition:.15s;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.ctrl .top button:hover{background:rgba(38,160,176,.6)}
.ctrl .center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:3}
.ctrl .center button{width:60px;height:60px;border:none;border-radius:50%;background:rgba(38,160,176,.9);color:#fff;font-size:1.5rem;cursor:pointer;transition:.15s;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 20px rgba(38,160,176,.3)}
.ctrl .center button:active{transform:scale(.92)}
.ctrl .bottom{padding:10px 16px 16px;position:relative;z-index:2}
.ctrl .progress{-webkit-appearance:none;appearance:none;width:100%;height:3px;border-radius:99px;background:rgba(255,255,255,.15);outline:none;cursor:pointer;margin-bottom:8px}
.ctrl .progress::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:14px;height:14px;border-radius:50%;background:#26a0b0;border:2px solid #fff;box-shadow:0 1px 6px rgba(0,0,0,.4);cursor:pointer}
.ctrl .progress::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:#26a0b0;border:2px solid #fff;box-shadow:0 1px 6px rgba(0,0,0,.4);cursor:pointer}
.ctrl .bar{display:flex;align-items:center;gap:10px}
.ctrl .bar button{padding:8px 10px;border:none;border-radius:6px;background:rgba(255,255,255,.08);color:#fff;font:600 .78rem/1 Inter,sans-serif;cursor:pointer;transition:.12s;display:flex;align-items:center;gap:6px}
.ctrl .bar button:active{transform:scale(.95)}
.ctrl .bar .fs-btn{margin-left:auto;background:rgba(255,255,255,.06)}
.ctrl .bar .tm{color:rgba(255,255,255,.6);font-size:.72rem;font-variant-numeric:tabular-nums;margin-left:10px;white-space:nowrap}

.tst{position:fixed;bottom:20px;right:20px;z-index:9999;display:flex;flex-direction:column-reverse;gap:8px;max-width:360px}
.tst div{padding:10px 16px;border-radius:8px;background:rgba(18,18,18,.95);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.09);color:#fff;font-size:.78rem;font-weight:500;box-shadow:0 8px 24px rgba(0,0,0,.5);animation:fd .3s}
.tst .er{border-left:3px solid #e01e3c}
.tst .ok{border-left:3px solid #26a0b0}
@keyframes fd{from{opacity:0;transform:translateY(12px)scale(.96)}to{opacity:1;transform:translateY(0)scale(1)}}

/* ===== RESPONSIVE ===== */
@media(max-width:600px){:root{--c:2}.hdr{flex-direction:row;flex-wrap:nowrap;padding:10px 12px;gap:8px}.tabs{display:none}.srch{min-width:80px;max-width:none}.ctrl .top{padding:12px 14px}.ctrl .bottom{padding:8px 12px 12px}.ctrl .center button{width:50px;height:50px;font-size:1.3rem}.logo .tx{display:none}}
@media(min-width:601px)and(max-width:900px){:root{--c:3}}
@media(min-width:901px)and(max-width:1100px){:root{--c:4}}
@media(min-width:1101px)and(max-width:1500px){:root{--c:5}}
@media(min-width:1501px){:root{--c:6}}
@media(min-width:2400px){:root{--c:8}.wrap{max-width:2000px}}
@media(hover:none){.card:hover{transform:none;border-color:rgba(255,255,255,.05);background:#161616}.card:hover .logobox{background:#1f1f1f}.card:hover .logobox img{transform:none}}
@supports(padding-top:env(safe-area-inset-top)){.hdr{padding-top:calc(12px + env(safe-area-inset-top))}.ctrl .bottom{padding-bottom:calc(16px + env(safe-area-inset-bottom))}}

/* ===== MOBILE TABS ===== */
.mob-tabs{display:none}
@media(max-width:600px){
  .mob-tabs{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:99;background:#121212;border-top:1px solid rgba(255,255,255,.06);padding:6px 4px env(safe-area-inset-bottom,6px);gap:2px;overflow-x:auto;-webkit-overflow-scrolling:touch}
  .mob-tabs::-webkit-scrollbar{display:none}
  .mob-tab{padding:6px 10px;border:none;border-radius:6px;background:transparent;color:#888;font:500 .64rem Inter,sans-serif;cursor:pointer;white-space:nowrap;flex-shrink:0;transition:.12s}
  .mob-tab.on{background:#26a0b0;color:#fff}
  .wrap{padding-bottom:calc(56px + env(safe-area-inset-bottom))}
}
</style>
</head>

<header class="hdr">

  <div class="srch">
    <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/></svg>

</header>

<div id="player">

  <div class="buf" id="buf"></div>
  <div class="ctrl" id="ctrl">

    <div class="top"><span id="ctt">—</span><button id="cX">✕</button></div>

      <div class="bar">
        <button id="playBtn"><span id="playIcon">▶</span></button>
        <span class="tm" id="tm">0:00 / 0:00</span>
        <button class="fs-btn" id="fsBtn">⛶</button>
      </div>
    </div>
  </div>
</div>

<div class="mob-tabs" id="mobTabs"></div>

<div class="wrap" id="gw">
  <div class="hid" id="cb">
    <div class="gh"><h2 id="gT">Все каналы</h2><span id="gC"></span></div>
    <div class="grid" id="gR"></div>
  </div>
  <div class="st hid" id="ep"><p>Ничего не найдено</p></div>
</div>

<div class="tst" id="tst"></div>

/* Working channel IDs (free access) */
var WORKING_IDS={20:1,83:1,86:1,8:1,9:1,10:1,11:1,12:1,13:1,14:1,15:1,16:1,17:1};

var LOGIN='tv-436510';
var PASS='safaral1';
var tab='all',srch='',hls=null,wk=null,ht=null,vl=[];
var vid=document.getElementById('vid');
var player=document.getElementById('player');
var ctrl=document.getElementById('ctrl');
var buf=document.getElementById('buf');
var gw=document.getElementById('gw');
var gR=document.getElementById('gR');
var ctt=document.getElementById('ctt');
var tm=document.getElementById('tm');
var prg=document.getElementById('prg');
var pB=document.getElementById('pB');
var playBtn=document.getElementById('playBtn');
var playIcon=document.getElementById('playIcon');
var fsBtn=document.getElementById('fsBtn');

function toast(m,t){var d=document.createElement('div');d.className=t||'';d.textContent=m;document.getElementById('tst').appendChild(d);setTimeout(function(){d.remove()},3500)}
function fmt(s){var m=Math.floor(s/60),sc=Math.floor(s%60);return m+':'+(sc<10?'0':'')+sc}

/* ===== FILTER ===== */
function filter(){
  var list=ALL_CHANNELS;
  if(tab!=='all') list=list.filter(function(c){return c[3].indexOf(tab)>=0});
  var q=srch.trim().toLowerCase();
  if(q) list=list.filter(function(c){return c[1].toLowerCase().indexOf(q)>=0});
  return list;
}

/* ===== RENDER ===== */
function mkCard(c){
  var id=c[0],title=c[1],logo=c[2];
  var avail=WORKING_IDS[id]===1;
  var el=document.createElement('div');
  el.className='card'+(avail?' avail':'');
  el.tabIndex=0;el.setAttribute('role','button');
  el.setAttribute('data-id',id);

  var lb=document.createElement('div');lb.className='logobox';
  var img=document.createElement('img');
  img.src=logo;img.alt=title;img.loading='lazy';img.decoding='async';
  img.onerror=function(){var t=this.parentElement;if(t){t.innerHTML='<div style="font-weight:800;font-size:1rem;color:#555">'+title.charAt(0)+'</div>';t.style.background='#1a1a1a'}};
  lb.appendChild(img);
  el.appendChild(lb);

  var live=document.createElement('span');live.className='live';live.textContent='Live';
  el.appendChild(live);

  var lock=document.createElement('span');lock.className='lock';
  lock.innerHTML='<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><rect x="4" y="11" width="16" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>';
  el.appendChild(lock);

  var info=document.createElement('div');info.className='info';
  var h3=document.createElement('h3');h3.textContent=title;info.appendChild(h3);
  var sub=document.createElement('div');sub.className='sub';sub.textContent=avail?'Бесплатный доступ':'Требуется подписка';info.appendChild(sub);
  el.appendChild(info);

  el.addEventListener('click',function(){openP(c)});
  el.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();openP(c)}});
  return el;
}

function render(){
  gR.innerHTML='';var list=filter(),n=list.length;
  var w=['канал','канала','каналов'],i=n%100>10&&n%100<14?2:[0,1,2,2,2][Math.min(n%10,5)];
  document.getElementById('gC').textContent=n+' '+w[i];
  if(!n){document.getElementById('ep').classList.remove('hid');return}
  document.getElementById('ep').classList.add('hid');
  var f=document.createDocumentFragment();list.forEach(function(c){f.appendChild(mkCard(c))});gR.appendChild(f);
}

function buildTabs(){
  var box=document.getElementById('tabs');box.innerHTML='';
  var mob=document.getElementById('mobTabs');mob.innerHTML='';
  var items=[['all','Все каналы']].concat(CATEGORIES.map(function(c){return[c.name,c.title]}));
  items.forEach(function(it){
    var name=it[0],label=it[1];
    var b=document.createElement('button');b.className='tab'+(name===tab?' on':'');b.textContent=label;
    b.addEventListener('click',function(){setTab(name)});
    box.appendChild(b);
    var mb=document.createElement('button');mb.className='mob-tab'+(name===tab?' on':'');mb.textContent=label;
    mb.addEventListener('click',function(){setTab(name)});
    mob.appendChild(mb);
  });
}

function setTab(name){
  tab=name;
  document.querySelectorAll('.tab').forEach(function(t){t.classList.toggle('on',t.textContent===(name==='all'?'Все каналы':(CATEGORIES.filter(function(c){return c.name===name})[0]||{}).title||name))});
  document.querySelectorAll('.mob-tab').forEach(function(t){t.classList.toggle('on',t.textContent===(name==='all'?'Все каналы':(CATEGORIES.filter(function(c){return c.name===name})[0]||{}).title||name))});
  render();
}

/* ===== VIDEO LISTENERS ===== */
function addVL(e,f){vid.addEventListener(e,f);vl.push([e,f])}
function rmVL(){vl.forEach(function(v){vid.removeEventListener(v[0],v[1])});vl=[]}

/* ===== CONTROLS ===== */
function showC(){ctrl.classList.add('on');clearTimeout(ht);ht=setTimeout(function(){ctrl.classList.remove('on')},5000)}
function hideC(){ctrl.classList.remove('on');clearTimeout(ht)}
function toggleC(){if(ctrl.classList.contains('on'))hideC();else showC()}

/* ===== PROGRESS ===== */
function updPrg(){if(vid.duration&&isFinite(vid.duration))prg.value=(vid.currentTime/vid.duration)*100}
function seekPrg(){if(vid.duration&&isFinite(vid.duration))vid.currentTime=(prg.value/100)*vid.duration}

/* ===== WAKE LOCK ===== */
function lockWk(){try{if('wakeLock'in navigator)navigator.wakeLock.request('screen').then(function(w){wk=w})}catch(e){}}
function unlkWk(){if(wk){try{wk.release()}catch(e){}wk=null}}

/* ===== FULLSCREEN ===== */
function goFS(){try{var el=player;if(el.requestFullscreen)el.requestFullscreen();else if(el.webkitRequestFullscreen)el.webkitRequestFullscreen();else if(el.mozRequestFullScreen)el.mozRequestFullScreen();else if(el.msRequestFullscreen)el.msRequestFullscreen()}catch(e){}}
function exitFS(){try{if(document.fullscreenElement)document.exitFullscreen();else if(document.webkitFullscreenElement)document.webkitExitFullscreen()}catch(e){}}

/* ===== GET STREAM URL (auto-login + channel/play) ===== */
var sessCookie='';
function apiLogin(){
  return fetch('https://sarkor.tv/api/user/v2/login',{
    method:'POST',
    headers:{'Content-Type':'application/json','Accept':'application/json'},
    body:JSON.stringify({login:LOGIN,password:PASS}),
    credentials:'include'
  }).then(function(r){return r.json()}).then(function(d){
    if(d.status==='ok'){return d}
    throw new Error('Auth fail');
  });
}

function getStreamUrl(id){
  return fetch('https://sarkor.tv/api/channel/play/'+id,{
    method:'GET',
    headers:{'Accept':'application/json'},
    credentials:'include'
  }).then(function(r){return r.json()}).then(function(d){
    if(d.status==='ok'&&d.result&&d.result.url) return d.result.url;
    throw new Error(d.message||'No url');
  });
}

/* ===== PLAYER ===== */
function openP(ch){
  var id=ch[0],title=ch[1];
  if(WORKING_IDS[id]!==1){
    toast('Канал «'+title+'» доступен только по подписке','er');
    return;
  }
  try{
    if(hls){hls.destroy();hls=null}
    rmVL();
    vid.removeAttribute('src');
    ctt.textContent=title;
    pB.textContent='\u25b6';
    playIcon.textContent='\u25b6';
    buf.classList.remove('off');
    tm.textContent='0:00 / 0:00';
    prg.value=0;
    gw.classList.add('hid');
    var mt=document.querySelector('.mob-tabs');if(mt)mt.style.display='none';
    player.classList.add('on');
    showC();
    goFS();
    lockWk();

    toast('Подключаемся к '+title+'...');
    getStreamUrl(id).then(function(url){
      play(url);
    }).catch(function(e){
      buf.classList.add('off');
      toast('Ошибка доступа: '+e.message,'er');
      toast('Попробуйте оплатить подписку','er');
    });

    window.scrollTo(0,0);
  }catch(e){console.error('[P]',e);buf.classList.add('off');toast('Ошибка: '+e.message,'er')}
}

function play(url){
  if(typeof Hls!=='undefined'&&Hls.isSupported()){
    hls=new Hls({capLevelToPlayerSize:true,maxBufferLength:30,startLevel:-1,enableWorker:true});
    hls.loadSource(url);hls.attachMedia(vid);
    addVL('playing',function(){playIcon.textContent='\u23f8';pB.textContent='\u23f8';buf.classList.add('off')});
    addVL('pause',function(){playIcon.textContent='\u25b6';pB.textContent='\u25b6'});
    addVL('waiting',function(){buf.classList.remove('off')});
    addVL('canplay',function(){buf.classList.add('off')});
    addVL('timeupdate',function(){if(vid.duration&&isFinite(vid.duration)){tm.textContent=fmt(vid.currentTime)+' / '+fmt(vid.duration);updPrg()}});
    addVL('error',function(){buf.classList.add('off');toast('Ошибка видео','er')});
    hls.on(Hls.Events.MANIFEST_PARSED,function(){buf.classList.add('off');vid.play().catch(function(){})});
    hls.on(Hls.Events.ERROR,function(_,d){
      if(d.fatal){buf.classList.add('off');
        if(d.type===Hls.ErrorTypes.NETWORK_ERROR){toast('Нет сети','er');hls.startLoad()}
        else if(d.type===Hls.ErrorTypes.MEDIA_ERROR){toast('Ошибка медиа','er');hls.recoverMediaError()}
        else toast('Формат не поддерживается','er')}
    });
  } else if(vid.canPlayType('application/vnd.apple.mpegurl')){
    vid.src=url;
    addVL('loadedmetadata',function(){buf.classList.add('off');vid.play().catch(function(){})});
    addVL('playing',function(){playIcon.textContent='\u23f8';pB.textContent='\u23f8';buf.classList.add('off')});
    addVL('pause',function(){playIcon.textContent='\u25b6';pB.textContent='\u25b6'});
    addVL('timeupdate',function(){if(vid.duration&&isFinite(vid.duration)){tm.textContent=fmt(vid.currentTime)+' / '+fmt(vid.duration);updPrg()}});
    addVL('error',function(){buf.classList.add('off');toast('Ошибка видео','er')});
  } else {
    buf.classList.add('off');
    toast('HLS не поддерживается','er');
  }
}

function closeP(){
  if(hls){hls.destroy();hls=null}
  rmVL();
  vid.pause();vid.removeAttribute('src');vid.load();
  buf.classList.add('off');
  player.classList.remove('on');
  gw.classList.remove('hid');
  var mt=document.querySelector('.mob-tabs');if(mt)mt.style.display='';
  exitFS();unlkWk();hideC();
}

function togPlay(){
  if(!vid.src)return;
  if(vid.paused)vid.play().catch(function(){});else vid.pause();
  showC();
}

/* ===== EVENTS ===== */
var debTimer;
document.getElementById('inp').addEventListener('input',function(){clearTimeout(debTimer);debTimer=setTimeout(function(){srch=document.getElementById('inp').value;render()},200)});
document.getElementById('cX').addEventListener('click',closeP);
document.getElementById('pB').addEventListener('click',togPlay);
playBtn.addEventListener('click',togPlay);
fsBtn.addEventListener('click',function(e){e.stopPropagation();if(document.fullscreenElement||document.webkitFullscreenElement)exitFS();else goFS()});
prg.addEventListener('input',seekPrg);
document.getElementById('player').addEventListener('click',function(e){
  if(!player.classList.contains('on'))return;
  if(e.target.tagName==='BUTTON'||e.target.closest('button'))return;
  if(e.target===prg||e.target.closest('.progress'))return;
  toggleC();
});
document.addEventListener('mousemove',function(){if(player.classList.contains('on'))showC()});
document.addEventListener('touchstart',function(){if(player.classList.contains('on'))showC()},{passive:true});
document.addEventListener('keydown',function(e){
  if(!player.classList.contains('on'))return;
  if(e.key==='Escape')closeP();
  if(e.key===' '){e.preventDefault();togPlay()}
  if(e.key==='f'||e.key==='F')goFS();
});
document.getElementById('logo').addEventListener('click',function(e){e.preventDefault();if(player.classList.contains('on'))closeP()});

/* ===== INIT ===== */
document.getElementById('cb').classList.remove('hid');
buildTabs();
render();

})();
