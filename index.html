<meta name="apple-mobile-web-app-capable" content="yes">

<style>
*{margin:0;padding:0;box-sizing:border-box}
html{font-size:16px}
body{font-family:Inter,sans-serif;color:#f0f0f0;background:#1e1e1e;min-height:100dvh;-webkit-font-smoothing:antialiased;overflow-x:hidden}
::-webkit-scrollbar{width:4px;height:4px}::-webkit-scrollbar-thumb{background:rgba(255,255,255,.08);border-radius:99px}*{scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.08) transparent}
.hdr{display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:12px 20px;background:#141414;border-bottom:1px solid rgba(255,255,255,.06);position:sticky;top:0;z-index:100}
.logo{display:flex;align-items:center;gap:8px;text-decoration:none;font-size:clamp(1.1rem,1.5vw,1.4rem);font-weight:700;font-family:MuseoModerno,sans-serif;color:#e01e5a;flex-shrink:0;cursor:pointer;letter-spacing:-.02em}
.tabs{display:flex;flex-wrap:wrap;gap:4px;flex:1;min-width:160px;justify-content:center}
.tab{padding:6px 14px;border:none;border-radius:6px;background:transparent;color:#999;font:500 clamp(.68rem,.8vw,.78rem)/1.3 Inter,sans-serif;cursor:pointer;white-space:nowrap;transition:.15s;-webkit-tap-highlight-color:transparent;user-select:none}
.tab:hover{color:#fff;background:rgba(255,255,255,.06)}
.tab:active{transform:scale(.95)}
.tab.on{background:#e01e5a;color:#fff;font-weight:600}
.srch{position:relative;flex:1;min-width:120px;max-width:280px}
.srch .si{position:absolute;left:11px;top:50%;transform:translateY(-50%);font-size:14px;opacity:.4;pointer-events:none;line-height:1;color:#999}
.srch input{width:100%;padding:8px 10px 8px 34px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:8px;color:#f0f0f0;font-size:.82rem;outline:none;transition:.15s;-webkit-appearance:none}
.srch input::placeholder{color:#666}
.srch input:focus{border-color:#e01e5a;background:rgba(255,255,255,.08)}
.wrap{max-width:1920px;margin:0 auto;padding:clamp(10px,1.5vw,24px)}
.gh{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.gh h2{font-size:clamp(.85rem,1.1vw,1.05rem);font-weight:700;color:#999;letter-spacing:-.02em;font-family:MuseoModerno,sans-serif}
.gh span{font-size:clamp(.65rem,.8vw,.72rem);color:rgba(255,255,255,.25)}
.grid{display:grid;grid-template-columns:repeat(var(--c,5),1fr);gap:clamp(8px,1vw,16px)}
.card{display:flex;flex-direction:column;border-radius:12px;overflow:hidden;cursor:pointer;background:#2a2a2a;transition:transform .2s,border-color .2s;-webkit-tap-highlight-color:transparent;position:relative}
@media(hover:hover){.card:hover{transform:translateY(-3px)}.card:hover img{transform:scale(1.04)}}
.card:active{transform:scale(.97)}
.card .thumb{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;background:#1a1a1a;transition:transform .35s}
.card .badge{position:absolute;top:8px;left:8px;padding:3px 8px;border-radius:4px;background:#e01e5a;color:#fff;font-size:.6rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;line-height:1.2;pointer-events:none;z-index:2}
.card .badge.free{background:#27ae60}
.card .info{padding:10px 12px 12px;display:flex;flex-direction:column;gap:2px}
.card .info h3{font-size:clamp(.72rem,.85vw,.8rem);font-weight:600;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#f0f0f0}
.card .info .sub{font-size:clamp(.6rem,.7vw,.65rem);color:#888;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ld{display:flex;flex-direction:column;align-items:center;gap:14px;justify-content:center;min-height:240px}
.ld .sp{width:34px;height:34px;border:3px solid rgba(255,255,255,.05);border-top-color:#e01e5a;border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.ld p{font-size:.82rem;color:#888;font-weight:500}
.st{text-align:center;padding:40px 20px;border-radius:12px;background:#2a2a2a}
.st p{color:#888;font-size:.86rem;margin:8px 0 14px;max-width:400px;margin-left:auto;margin-right:auto}
.st button{padding:8px 22px;border:none;border-radius:6px;background:#e01e5a;color:#fff;font:600 .8rem Inter,sans-serif;cursor:pointer;transition:.15s}
.st button:hover{background:#c01a4e}
.st-er{border:1px solid rgba(255,90,110,.2)}
#player{display:none;position:fixed;inset:0;z-index:1000;background:#000;-webkit-user-select:none;user-select:none}
#player.on{display:flex}
#player video{width:100%;height:100%;object-fit:contain;display:block;background:#000}
.buf{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:40px;height:40px;border:3px solid rgba(255,255,255,.1);border-top-color:#e01e5a;border-radius:50%;animation:sp .7s linear infinite;z-index:1;pointer-events:none}
.buf.off{display:none}
.ctrl{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;justify-content:flex-end;opacity:0;transition:opacity .35s;pointer-events:none}
.ctrl.on{opacity:1;pointer-events:auto}
.ctrl .overlay{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.85) 0%,rgba(0,0,0,.15) 50%,transparent 100%);pointer-events:none;z-index:-1}
.ctrl .top{display:flex;align-items:center;gap:12px;padding:16px 20px;position:absolute;top:0;left:0;right:0}
.ctrl .top span{flex:1;font-weight:600;font-size:clamp(.9rem,2vw,1.3rem);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 4px rgba(0,0,0,.5)}
.ctrl .top button{width:36px;height:36px;border:none;border-radius:50%;background:rgba(0,0,0,.5);color:#fff;font-size:1.1rem;cursor:pointer;transition:.15s;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.ctrl .top button:hover{background:rgba(224,30,90,.5)}
.ctrl .center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:3}
.ctrl .center button{width:60px;height:60px;border:none;border-radius:50%;background:rgba(224,30,90,.9);color:#fff;font-size:1.5rem;cursor:pointer;transition:.15s;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 20px rgba(224,30,90,.3)}
.ctrl .center button:active{transform:scale(.92)}
.ctrl .bottom{padding:10px 16px 16px;position:relative;z-index:2}
.ctrl .progress{-webkit-appearance:none;appearance:none;width:100%;height:3px;border-radius:99px;background:rgba(255,255,255,.15);outline:none;cursor:pointer;margin-bottom:8px}
.ctrl .progress::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:14px;height:14px;border-radius:50%;background:#e01e5a;border:2px solid #fff;box-shadow:0 1px 6px rgba(0,0,0,.4);cursor:pointer}
.ctrl .progress::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:#e01e5a;border:2px solid #fff;box-shadow:0 1px 6px rgba(0,0,0,.4);cursor:pointer}
.ctrl .bar{display:flex;align-items:center;gap:10px}
.ctrl .bar button{padding:8px 10px;border:none;border-radius:6px;background:rgba(255,255,255,.08);color:#fff;font:600 .78rem/1 Inter,sans-serif;cursor:pointer;transition:.12s;display:flex;align-items:center;gap:6px}
.ctrl .bar button:active{transform:scale(.95)}
.ctrl .bar .fs-btn{margin-left:auto;background:rgba(255,255,255,.06)}
.ctrl .bar .tm{color:rgba(255,255,255,.6);font-size:.72rem;font-variant-numeric:tabular-nums;margin-left:10px;white-space:nowrap}
.tst{position:fixed;bottom:20px;right:20px;z-index:9999;display:flex;flex-direction:column-reverse;gap:8px;max-width:360px}
.tst div{padding:10px 16px;border-radius:8px;background:rgba(30,30,30,.95);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.08);color:#f0f0f0;font-size:.78rem;font-weight:500;box-shadow:0 8px 24px rgba(0,0,0,.5);animation:fd .3s}
.tst .er{border-left:3px solid #e01e5a}
@keyframes fd{from{opacity:0;transform:translateY(12px)scale(.96)}to{opacity:1;transform:translateY(0)scale(1)}}
.hid{display:none!important}
@media(max-width:600px){:root{--c:2}.hdr{flex-direction:row;flex-wrap:nowrap;padding:10px 12px;gap:8px}.tabs{display:none}.srch{min-width:80px;max-width:none}.ctrl .top{padding:12px 14px}.ctrl .bottom{padding:8px 12px 12px}.ctrl .center button{width:50px;height:50px;font-size:1.3rem}}
@media(min-width:601px)and(max-width:900px){:root{--c:3}}
@media(min-width:901px)and(max-width:1200px){:root{--c:4}}
@media(min-width:1201px)and(max-width:1920px){:root{--c:5}}
@media(min-width:1921px){:root{--c:6}body{font-size:18px}}
@media(min-width:2560px){:root{--c:7}.wrap{max-width:2200px}}
@media(hover:none){.card:hover{transform:none}.card:hover img{transform:none}}
@supports(padding-top:env(safe-area-inset-top)){.hdr{padding-top:calc(12px + env(safe-area-inset-top))}.ctrl .bottom{padding-bottom:calc(16px + env(safe-area-inset-bottom))}}
.mob-tabs{display:none}
@media(max-width:600px){
  .mob-tabs{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:99;background:#141414;border-top:1px solid rgba(255,255,255,.06);padding:6px 4px env(safe-area-inset-bottom,6px);gap:2px;overflow-x:auto;-webkit-overflow-scrolling:touch}
  .mob-tabs::-webkit-scrollbar{display:none}
  .mob-tab{padding:6px 10px;border:none;border-radius:6px;background:transparent;color:#888;font:500 .64rem Inter,sans-serif;cursor:pointer;white-space:nowrap;flex-shrink:0;transition:.12s}
  .mob-tab.on{background:#e01e5a;color:#fff}
  .wrap{padding-bottom:calc(56px + env(safe-area-inset-bottom))}
}
</style>
</head>

/* ===== DATA LOADING — EMBEDDED FIRST, API IN BACKGROUND ===== */
function getChannels(){
  /* Try localStorage cache first */
  try{
    var cached=localStorage.getItem(CACHE_KEY);
    if(cached){
      var obj=JSON.parse(cached);
      if(obj.ts&&Date.now()-obj.ts<CACHE_TTL&&obj.d&&obj.d.length>0) return obj.d;
    }
  }catch(e){}
  /* Fallback to embedded data */
  return EMBEDDED;
}

function saveCache(data){
  try{localStorage.setItem(CACHE_KEY,JSON.stringify({ts:Date.now(),d:data}))}catch(e){}
}

/* Update from API in background (non-blocking) */
function refreshFromAPI(){
  try{
    var xhr=new XMLHttpRequest();
    xhr.open('GET',API_URL,true);
    xhr.timeout=10000;
    xhr.onload=function(){
      if(xhr.status>=200&&xhr.status<300){
        try{
          var raw=JSON.parse(xhr.responseText);
          if(raw.tv_channels&&raw.tv_channels.length){
            var mapped=raw.tv_channels.map(function(c){
              return{id:c.flusonic_id||'',u:c.id||'',n:c.title_ru||c.title_en||c.title_uz||'',i:c.image||'',p:c.payment_type||'free',r:c.resolution||'HD',cat:c.category_ids||[],s:c.status!==false,k:c.secret_key||''};
            });
            saveCache(mapped);
            /* If user is on main view, silently update */
            if(!player.classList.contains('on')){
              chs=mapped;
              render();
            }
          }
        }catch(e){}
      }
    };
    xhr.onerror=function(){};
    xhr.ontimeout=function(){};
    xhr.send();
  }catch(e){}
}

/* ===== FILTER ===== */
function filter(){
  var list=chs.filter(function(c){return c.s});
  if(tab!=='Все'){
    var ids=CATS[tab],kws=KW[tab]||[];
    if(ids&&ids.length) list=list.filter(function(c){return(c.cat||[]).some(function(id){return ids.some(function(p){return id.indexOf(p)===0})})});
    if(kws.length) list=list.filter(function(c){var t=(c.n||'').toLowerCase();return kws.some(function(k){return t.indexOf(k.toLowerCase())>=0})});
  }
  var q=srch.trim().toLowerCase();
  if(q) list=list.filter(function(c){return(c.n||'').toLowerCase().indexOf(q)>=0});
  return list;
}

function mkCard(c){
  var el=document.createElement('div');el.className='card';el.tabIndex=0;el.setAttribute('role','button');
  var thumb=document.createElement('img');thumb.className='thumb';thumb.src=c.i||'';thumb.alt=c.n||'';thumb.loading='lazy';thumb.decoding='async';
  thumb.onerror=function(){var p=thumb.parentElement;if(p){p.style.background='linear-gradient(135deg,#e01e5a 0%,#7c0e3a 100%)';thumb.style.display='none'}};
  el.appendChild(thumb);
  var badge=document.createElement('span');badge.className='badge'+(c.p==='free'?' free':'');badge.textContent=c.p==='free'?'FREE':'TV';el.appendChild(badge);
  var info=document.createElement('div');info.className='info';
  var h3=document.createElement('h3');h3.textContent=c.n||'—';info.appendChild(h3);
  var sub=document.createElement('div');sub.className='sub';sub.textContent=c.r||'HD';info.appendChild(sub);
  el.appendChild(info);
  el.addEventListener('click',function(){openP(c)});
  el.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();openP(c)}});
  return el;
}

function render(){
  gR.innerHTML='';var list=filter(),n=list.length;
  var w=['канал','канала','каналов'],i=n%100>10&&n%100<14?2:[0,1,2,2,2][Math.min(n%10,5)];
  document.getElementById('gC').textContent=n+' '+w[i];
  if(!n){document.getElementById('ep').classList.remove('hid');return}
  document.getElementById('ep').classList.add('hid');
  var f=document.createDocumentFragment();list.forEach(function(c){f.appendChild(mkCard(c))});gR.appendChild(f);
}

function buildTabs(){
  var box=document.getElementById('tabs');box.innerHTML='';
  var mob=document.getElementById('mobTabs');mob.innerHTML='';
  Object.keys(CATS).forEach(function(name){
    var b=document.createElement('button');b.className='tab'+(name===tab?' on':'');b.textContent=name;
    b.addEventListener('click',function(){setTab(name)});
    box.appendChild(b);
    var mb=document.createElement('button');mb.className='mob-tab'+(name===tab?' on':'');mb.textContent=name;
    mb.addEventListener('click',function(){setTab(name)});
    mob.appendChild(mb);
  });
}

function setTab(name){
  tab=name;
  document.querySelectorAll('.tab').forEach(function(t){t.classList.toggle('on',t.textContent===name)});
  document.querySelectorAll('.mob-tab').forEach(function(t){t.classList.toggle('on',t.textContent===name)});
  render();
}

    prg.value=0;
    gw.classList.add('hid');
    var mt=document.querySelector('.mob-tabs');if(mt)mt.style.display='none';
    player.classList.add('on');
    showC();
    goFS();
    lockWk();
    var url=STREAM_BASE+ch.u+'/video.m3u8?secret_key='+ch.k;
    if(typeof Hls!=='undefined'&&Hls.isSupported()){
      hls=new Hls({capLevelToPlayerSize:true,maxBufferLength:30,startLevel:-1,enableWorker:true});
      hls.loadSource(url);hls.attachMedia(vid);
      addVL('playing',function(){playIcon.textContent='\u23f8';pB.textContent='\u23f8';buf.classList.add('off')});
      addVL('pause',function(){playIcon.textContent='\u25b6';pB.textContent='\u25b6'});
      addVL('waiting',function(){buf.classList.remove('off')});
      addVL('canplay',function(){buf.classList.add('off')});
      addVL('timeupdate',function(){if(vid.duration&&isFinite(vid.duration)){tm.textContent=fmt(vid.currentTime)+' / '+fmt(vid.duration);updPrg()}});
      addVL('error',function(){buf.classList.add('off');toast('\u041e\u0448\u0438\u0431\u043a\u0430 \u0432\u0438\u0434\u0435\u043e','er')});
      hls.on(Hls.Events.MANIFEST_PARSED,function(){buf.classList.add('off');vid.play().catch(function(){})});
      hls.on(Hls.Events.ERROR,function(_,d){
        if(d.fatal){buf.classList.add('off');
          if(d.type===Hls.ErrorTypes.NETWORK_ERROR){toast('\u041d\u0435\u0442 \u0441\u0435\u0442\u0438','er');hls.startLoad()}
          else if(d.type===Hls.ErrorTypes.MEDIA_ERROR){toast('\u041e\u0448\u0438\u0431\u043a\u0430 \u043c\u0435\u0434\u0438\u0430','er');hls.recoverMediaError()}
          else toast('\u0424\u043e\u0440\u043c\u0430\u0442 \u043d\u0435 \u043f\u043e\u0434\u0434\u0435\u0440\u0436\u0438\u0432\u0430\u0435\u0442\u0441\u044f','er')}
      });
    } else if(vid.canPlayType('application/vnd.apple.mpegurl')){
      vid.src=url;
      addVL('loadedmetadata',function(){buf.classList.add('off');vid.play().catch(function(){})});
      addVL('playing',function(){playIcon.textContent='\u23f8';pB.textContent='\u23f8';buf.classList.add('off')});
      addVL('pause',function(){playIcon.textContent='\u25b6';pB.textContent='\u25b6'});
      addVL('timeupdate',function(){if(vid.duration&&isFinite(vid.duration)){tm.textContent=fmt(vid.currentTime)+' / '+fmt(vid.duration);updPrg()}});
      addVL('error',function(){buf.classList.add('off');toast('\u041e\u0448\u0438\u0431\u043a\u0430 \u0432\u0438\u0434\u0435\u043e','er')});
    } else {
      buf.classList.add('off');
      toast('HLS \u043d\u0435 \u043f\u043e\u0434\u0434\u0435\u0440\u0436\u0438\u0432\u0430\u0435\u0442\u0441\u044f','er');
    }
    window.scrollTo(0,0);
  }catch(e){console.error('[P]',e);buf.classList.add('off');toast('\u041e\u0448\u0438\u0431\u043a\u0430: '+e.message,'er')}
}

function closeP(){
  if(hls){hls.destroy();hls=null}
  rmVL();
  vid.pause();vid.removeAttribute('src');vid.load();
  buf.classList.add('off');
  player.classList.remove('on');
  gw.classList.remove('hid');
  var mt=document.querySelector('.mob-tabs');if(mt)mt.style.display='';
  exitFS();unlkWk();hideC();
}

function togPlay(){
  if(!vid.src)return;
  if(vid.paused)vid.play().catch(function(){});else vid.pause();
  showC();
}

/* ===== EVENTS ===== */
var debTimer;
document.getElementById('inp').addEventListener('input',function(){clearTimeout(debTimer);debTimer=setTimeout(function(){srch=document.getElementById('inp').value;render()},200)});
document.getElementById('erB').addEventListener('click',go);
document.getElementById('cX').addEventListener('click',closeP);
document.getElementById('pB').addEventListener('click',togPlay);
playBtn.addEventListener('click',togPlay);
fsBtn.addEventListener('click',function(e){e.stopPropagation();if(document.fullscreenElement||document.webkitFullscreenElement)exitFS();else goFS()});
prg.addEventListener('input',seekPrg);
document.getElementById('player').addEventListener('click',function(e){
  if(!player.classList.contains('on'))return;
  if(e.target.tagName==='BUTTON'||e.target.closest('button'))return;
  if(e.target===prg||e.target.closest('.progress'))return;
  toggleC();
});
document.addEventListener('mousemove',function(){if(player.classList.contains('on'))showC()});
document.addEventListener('touchstart',function(){if(player.classList.contains('on'))showC()},{passive:true});
document.addEventListener('keydown',function(e){
  if(!player.classList.contains('on'))return;
  if(e.key==='Escape')closeP();
  if(e.key===' '){e.preventDefault();togPlay()}
  if(e.key==='f'||e.key==='F')goFS();
});
document.getElementById('logo').addEventListener('click',function(e){e.preventDefault();if(player.classList.contains('on'))closeP()});

/* ===== INIT ===== */
function go(){
  /* Load instantly from embedded/cache — NO waiting for API */
  chs=getChannels();
  document.getElementById('ld').classList.add('hid');
  document.getElementById('cb').classList.remove('hid');
  buildTabs();
  render();
  /* Refresh from API in background (non-blocking) */
  refreshFromAPI();
}

if(document.readyState!=='loading')go();else document.addEventListener('DOMContentLoaded',go);

})();
</script>
</body>
</html>
